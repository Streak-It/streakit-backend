services:
  postgres:
    image: postgres:17-alpine
    container_name: streakit_postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${DATABASE_USER:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-postgres}
      POSTGRES_DB: ${DATABASE_NAME:-streakit_api}

    ports:
      # Bound to localhost so the DB isn't exposed on the LAN.
      - "127.0.0.1:${DATABASE_PORT:-5432}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DATABASE_USER:-postgres} -d ${DATABASE_NAME:-streakit_api}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Run with: docker compose --profile app up -d --build
  api:
    profiles: ["app"]
    build: .
    container_name: streakit_api
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_PORT: 8080
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    stop_grace_period: 15s

volumes:
  postgres_data:
    name: streakit_api_postgres_data
